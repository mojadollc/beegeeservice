<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Body -->
  <ellipse cx="32" cy="36" rx="14" ry="16" fill="#f59e0b"/>
  <!-- Stripes -->
  <rect x="18" y="30" width="28" height="5" fill="#1e293b"/>
  <rect x="18" y="39" width="28" height="5" fill="#1e293b"/>
  <!-- Head -->
  <circle cx="32" cy="18" r="9" fill="#1e293b"/>
  <!-- Eyes -->
  <circle cx="29" cy="17" r="2" fill="white"/>
  <circle cx="35" cy="17" r="2" fill="white"/>
  <!-- Wings -->
  <ellipse cx="20" cy="26" rx="8" ry="5" fill="#99f6e4" opacity="0.8" transform="rotate(-20 20 26)"/>
  <ellipse cx="44" cy="26" rx="8" ry="5" fill="#99f6e4" opacity="0.8" transform="rotate(20 44 26)"/>
  <!-- Antennae -->
  <line x1="28" y1="10" x2="24" y2="4" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="10" x2="40" y2="4" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="24" cy="4" r="2" fill="#f59e0b"/>
  <circle cx="40" cy="4" r="2" fill="#f59e0b"/>
</svg>
